<div class="auth-page">
    <div class="auth-container">
        <!-- Logo -->
        <div class="auth-logo">
            <div class="logo-icon">CX</div>
            <span class="logo-text">CryptoX</span>
        </div>

        <!-- Register Card -->
        <ui-card variant="elevated">
            <div class="auth-content">
                <div class="auth-header">
                    <h1 class="auth-title">Create Account</h1>
                    <p class="auth-subtitle">Start trading crypto in minutes</p>
                </div>

                <!-- Registration Form -->
                <form class="auth-form" (ngSubmit)="onSubmit()">
                    <ui-input type="text" label="Username" placeholder="Choose a username" [ngModel]="username"
                        (ngModelChange)="username = $event" name="username" [error]="usernameError()" />

                    <ui-input type="email" label="Email" placeholder="Enter your email" [ngModel]="email"
                        (ngModelChange)="email = $event" name="email" [error]="emailError()" />

                    <ui-input type="password" label="Password" placeholder="Create a password" [ngModel]="password"
                        (ngModelChange)="password = $event" name="password"
                        hint="Min. 8 characters with uppercase, lowercase and number" [error]="passwordError()" />

                    <ui-input type="password" label="Confirm Password" placeholder="Confirm your password"
                        [ngModel]="confirmPassword" (ngModelChange)="confirmPassword = $event" name="confirmPassword"
                        [error]="confirmPasswordError()" />

                    <label class="terms-checkbox">
                        <input type="checkbox" [ngModel]="acceptTerms" (ngModelChange)="acceptTerms = $event"
                            name="acceptTerms" />
                        <span>I agree to the <a href="#">Terms of Service</a> and
                            <a href="#">Privacy Policy</a></span>
                    </label>

                    <ui-button type="submit" variant="primary" [fullWidth]="true" [loading]="isLoading()"
                        [disabled]="!acceptTerms">
                        Create Account
                    </ui-button>
                </form>

                @if (error()) {
                <div class="error-message">{{ error() }}</div>
                }

                <div class="auth-footer">
                    <span>Already have an account?</span>
                    <a routerLink="/auth/login" class="auth-link">Sign in</a>
                </div>
            </div>
        </ui-card>

        <!-- Footer Links -->
        <div class="page-footer">
            <a href="#">Terms of Service</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Support</a>
        </div>
    </div>
</div>
