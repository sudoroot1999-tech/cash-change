<div class="auth-page">
    <div class="auth-container">
        <!-- Logo -->
        <div class="auth-logo">
            <div class="logo-icon">CX</div>
            <span class="logo-text">CryptoX</span>
        </div>

        <!-- Login Card -->
        <ui-card variant="elevated">
            <div class="auth-content">
                <div class="auth-header">
                    <h1 class="auth-title">Sign in</h1>
                    <p class="auth-subtitle">Your blockchain wallet in one-click</p>
                </div>

                <!-- Social Login -->
                <div class="social-buttons">
                    <button class="social-btn google">
                        <svg class="social-icon" viewBox="0 0 24 24">
                            <path fill="currentColor"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="currentColor"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="currentColor"
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                            <path fill="currentColor"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        </svg>
                        Continue with Google
                    </button>
                </div>

                <div class="divider">
                    <span>or</span>
                </div>

                <!-- Email Login Form -->
                <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
                    <ui-input type="email" label="Email" placeholder="Enter your email" formControlName="email"
                        [error]="fieldError('email')" name="email" />

                    <ui-input label="Password" type="password" formControlName="password"
                        [error]="fieldError('password')" placeholder=" Enter your password" name="password" />

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" formControlName="rememberMe" />
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <ui-button type="submit" variant="primary" [fullWidth]="true" [loading]="isLoading()">
                        Sign In
                    </ui-button>
                </form>

                @if (error()) {
                <div class="error-message">{{ error() }}</div>
                }

                <div class="auth-footer">
                    <span>Don't have an account?</span>
                    <a routerLink="/auth/register" class="auth-link">Sign up</a>
                </div>
            </div>
        </ui-card>

        <!-- Footer Links -->
        <div class="page-footer">
            <a href="#">Terms of Service</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Support</a>
        </div>
    </div>
</div>
