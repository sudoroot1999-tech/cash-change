services:
  # ==================== Databases ====================
  postgres:
    image: postgres:16-alpine
    container_name: exchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exchange_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exchange_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-exchange}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-exchange_user} -d ${POSTGRES_DB:-exchange}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exchange-network

  mongodb:
    image: mongo:7
    container_name: exchange-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mongo_dev_password}
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exchange-network

  redis:
    image: redis:7-alpine
    container_name: exchange-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_dev_password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exchange-network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: exchange-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exchange_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exchange_dev_password}
      POSTGRES_DB: market_data
    ports:
      - '5433:5432'
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - exchange-network

  # ==================== Object Storage ====================
  minio:
    image: minio/minio:latest
    container_name: exchange-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - exchange-network

  # ==================== Message Broker ====================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: exchange-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-exchange}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
    ports:
      - '5672:5672'
      - '15672:15672' # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - exchange-network

  # ==================== Core Services ====================
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: exchange-user-service
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3001
      - GRPC_PORT=5001
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-exchange_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-exchange_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-exchange}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - MINIO_HOST=${MINIO_HOST:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_dev_password}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-exchange}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-exchange}:${RABBITMQ_PASSWORD:-rabbitmq_dev_password}@rabbitmq:5672
    ports:
      - '3001:3001'
      - '5001:5001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - exchange-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: exchange-auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3002
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-exchange_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-exchange_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-exchange}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - USER_SERVICE_GRPC_URL=user-service:5001
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - exchange-network

  wallet-service:
    build:
      context: .
      dockerfile: services/wallet-service/Dockerfile
    container_name: exchange-wallet-service
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3003
      - GRPC_PORT=5003
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-exchange_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-exchange_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-exchange}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-exchange}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-exchange}:${RABBITMQ_PASSWORD:-rabbitmq_dev_password}@rabbitmq:5672
    ports:
      - '3003:3003'
      - '5003:5003'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - exchange-network

  trading-service:
    build:
      context: .
      dockerfile: services/trading-service/Dockerfile
    container_name: exchange-trading-service
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3004
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-exchange_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-exchange_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-exchange}
      - TIMESCALE_HOST=${TIMESCALE_HOST:-timescaledb}
      - TIMESCALE_PORT=${TIMESCALE_PORT:-5432}
      - TIMESCALE_USER=${TIMESCALE_USER:-exchange_user}
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD:-exchange_dev_password}
      - TIMESCALE_DB=${TIMESCALE_DB:-market_data}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-exchange}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-exchange}:${RABBITMQ_PASSWORD:-rabbitmq_dev_password}@rabbitmq:5672
      - MATCHING_ENGINE_GRPC_URL=matching-engine:5010
      - WALLET_SERVICE_GRPC_URL=wallet-service:5003
    ports:
      - '3004:3004'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - exchange-network

  market-data-service:
    build:
      context: ./services/market-data-service
      dockerfile: Dockerfile
    container_name: exchange-market-data
    restart: unless-stopped
    environment:
      - PORT=3005
      - GRPC_PORT=5005
      - TIMESCALE_HOST=${TIMESCALE_HOST:-timescaledb}
      - TIMESCALE_PORT=${TIMESCALE_PORT:-5432}
      - TIMESCALE_USER=${TIMESCALE_USER:-exchange_user}
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD:-exchange_dev_password}
      - TIMESCALE_DB=${TIMESCALE_DB:-market_data}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-exchange}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-exchange}:${RABBITMQ_PASSWORD:-rabbitmq_dev_password}@rabbitmq:5672
    ports:
      - '3005:3005'
      - '5005:5005'
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - exchange-network

  matching-engine:
    build:
      context: ./services/matching-engine
      dockerfile: Dockerfile
    container_name: exchange-matching-engine
    restart: unless-stopped
    environment:
      - PORT=3010
      - GRPC_PORT=5010
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-exchange}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-exchange}:${RABBITMQ_PASSWORD:-rabbitmq_dev_password}@rabbitmq:5672
    ports:
      - '3010:3010'
      - '5010:5010'
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - exchange-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: exchange-notification
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3006
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-exchange_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-exchange_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-exchange}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-exchange}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-exchange}:${RABBITMQ_PASSWORD:-rabbitmq_dev_password}@rabbitmq:5672
    ports:
      - '3006:3006'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - exchange-network


  compliance-service:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: exchange-compliance
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3007
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-exchange_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-exchange_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-exchange}
      - MINIO_HOST=${MINIO_HOST:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_dev_password}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-exchange}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-exchange}:${RABBITMQ_PASSWORD:-rabbitmq_dev_password}@rabbitmq:5672
      - USER_SERVICE_URL=http://user-service:3001
      - USER_SERVICE_GRPC_URL=user-service:5001
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - exchange-network

  security-service:
    build:
      context: .
      dockerfile: services/security-service/Dockerfile
    container_name: exchange-security
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3008
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-exchange_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-exchange_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-exchange}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "3008:3008"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - exchange-network

  proof-of-reserves-service:
    build:
      context: .
      dockerfile: services/proof-of-reserves-service/Dockerfile
    container_name: exchange-proof-of-reserves
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3009
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-exchange_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-exchange_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-exchange}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-exchange}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-exchange}:${RABBITMQ_PASSWORD:-rabbitmq_dev_password}@rabbitmq:5672
      - WALLET_SERVICE_URL=http://wallet-service:3003
    ports:
      - "3009:3009"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - exchange-network


  # ==================== API Gateway ====================
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: exchange-api-gateway
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3000
      - USER_SERVICE_URL=http://user-service:3001
      - AUTH_SERVICE_URL=http://auth-service:3002
      - WALLET_SERVICE_URL=http://wallet-service:3003
      - TRADING_SERVICE_URL=http://trading-service:3004
      - MARKET_DATA_URL=http://market-data-service:3005
      - NOTIFICATION_URL=http://notification-service:3006
      - COMPLIANCE_URL=http://compliance-service:3007
      - SECURITY_URL=http://security-service:3008
      - RESERVES_URL=http://proof-of-reserves-service:3009
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-exchange}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-exchange}:${RABBITMQ_PASSWORD:-rabbitmq_dev_password}@rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
    ports:
      - '3000:3000'
    depends_on:
      - user-service
      - auth-service
      - wallet-service
      - trading-service
      - market-data-service
      - notification-service
      - compliance-service
      - security-service
      - proof-of-reserves-service
    networks:
      - exchange-network

  # ==================== Frontend Services ====================
  marketing:
    build:
      context: .
      dockerfile: frontend/apps/marketing/Dockerfile
    expose:
      - "3100"
    networks:
      - exchange-network

  exchange-app:
    build:
      context: .
      dockerfile: frontend/apps/exchange-app/Dockerfile
    volumes:
      - exchange_app_dist:/dist
    networks:
      - exchange-network

  # ==================== Nginx Proxy ====================
  nginx:
    image: nginx:alpine
    container_name: exchange-nginx
    restart: unless-stopped
    volumes:
      - exchange_app_dist:/usr/share/nginx/html/app:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'
    depends_on:
      - marketing
      - exchange-app
    networks:
      - exchange-network

networks:
  exchange-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  timescaledb_data:
  rabbitmq_data:
  minio_data:
  exchange_app_dist:
