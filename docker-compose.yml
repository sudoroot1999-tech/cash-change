# ==================== Common Configuration Templates ====================
x-common-env: &common-env
  NODE_ENV: development
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-exchange_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exchange_dev_password}
  POSTGRES_DB: ${POSTGRES_DB:-exchange}
  DATABASE_URL: postgres://${POSTGRES_USER:-exchange_user}:${POSTGRES_PASSWORD:-exchange_dev_password}@postgres:5432/${POSTGRES_DB:-exchange}?sslmode=disable

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
  REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-exchange}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-exchange}:${RABBITMQ_PASSWORD:-rabbitmq_dev_password}@rabbitmq:5672

x-kafka-env: &kafka-env
  KAFKA_KRAFT_MODE: "true"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_NODE_ID: 1
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
  CLUSTER_ID: "${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
  KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${KAFKA_BROKER_HOST:-localhost}:${KAFKA_HOST_PORT:-29092}"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_NUM_PARTITIONS: 1
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_BROKERS: kafka:9092

x-timescale-env: &timescale-env
  TIMESCALE_HOST: timescaledb
  TIMESCALE_PORT: 5432
  TIMESCALE_USER: ${POSTGRES_USER:-exchange_user}
  TIMESCALE_PASSWORD: ${POSTGRES_PASSWORD:-exchange_dev_password}
  TIMESCALE_DB: market_data
  DATABASE_URL: postgres://${POSTGRES_USER:-exchange_user}:${POSTGRES_PASSWORD:-exchange_dev_password}@postgres:5432/${POSTGRES_DB:-exchange}?sslmode=disable

x-minio-env: &minio-env
  MINIO_HOST: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: false
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}

x-service-urls: &service-urls
  USER_SERVICE_URL: http://user-service:3001
  USER_SERVICE_GRPC_URL: user-service:5001
  AUTH_SERVICE_URL: http://auth-service:3002
  WALLET_SERVICE_URL: http://wallet-service:3003
  WALLET_SERVICE_GRPC_URL: wallet-service:5003
  TRADING_SERVICE_URL: http://trading-service:3004
  MARKET_DATA_URL: http://market-data-service:3005
  MARKET_DATA_GRPC_URL: market-data-service:5005
  NOTIFICATION_URL: http://notification-service:3006
  COMPLIANCE_URL: http://compliance-service:3007
  SECURITY_URL: http://security-service:3008
  RESERVES_URL: http://proof-of-reserves-service:3009
  MATCHING_ENGINE_GRPC_URL: matching-engine:5010
  ADMIN_URL: http://admin-service:3011

x-common-depends: &common-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  # ==================== Databases ====================
  postgres:
    image: postgres:16-alpine
    container_name: exchange-postgres
    restart: unless-stopped
    environment:
      <<: *postgres-env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-exchange_user} -d ${POSTGRES_DB:-exchange}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exchange-network

  mongodb:
    image: mongo:7
    container_name: exchange-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mongo_dev_password}
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exchange-network

  redis:
    image: redis:7-alpine
    container_name: exchange-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_dev_password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exchange-network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: exchange-timescaledb
    restart: unless-stopped
    environment:
      <<: *timescale-env
    ports:
      - '5433:5432'
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - exchange-network

  minio:
    image: minio/minio:latest
    container_name: exchange-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      <<: *minio-env
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - exchange-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: exchange-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-exchange}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - exchange-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: exchange-kafka
    ports:
      - "29092:9092"  
      - "9093:9093"    
    environment:
        <<: *kafka-env
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - exchange-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: exchange-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    depends_on:
      - kafka
    networks:
      - exchange-network


  # ==================== Core Services ====================
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: exchange-user-service
    restart: unless-stopped
    environment:
      <<: [*common-env, *postgres-env, *redis-env, *rabbitmq-env, *minio-env, *kafka-env]
      PORT: 3001
      GRPC_PORT: 5001
    ports:
      - '3001:3001'
      - '5001:5001'
    depends_on: *common-depends
    networks:
      - exchange-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: exchange-auth-service
    restart: unless-stopped
    environment:
      <<: [*common-env, *postgres-env, *redis-env, *service-urls]
      PORT: 3002
    ports:
      - '3002:3002'
    depends_on:
      <<: *common-depends
    networks:
      - exchange-network

  wallet-service:
    build:
      context: .
      dockerfile: services/wallet-service/Dockerfile
    container_name: exchange-wallet-service
    restart: unless-stopped
    environment:
      <<: [*common-env, *postgres-env, *redis-env, *rabbitmq-env]
      PORT: 3003
      GRPC_PORT: 5003
    ports:
      - '3003:3003'
      - '5003:5003'
    depends_on: *common-depends
    networks:
      - exchange-network

  trading-service:
    build:
      context: .
      dockerfile: services/trading-service/Dockerfile
    container_name: exchange-trading-service
    restart: unless-stopped
    environment:
      <<: [*common-env, *postgres-env, *redis-env, *rabbitmq-env, *timescale-env, *service-urls]
      PORT: 3004
    ports:
      - '3004:3004'
    depends_on: *common-depends
    networks:
      - exchange-network

  market-data-service:
    build:
      context: ./services/market-data-service
      dockerfile: Dockerfile
    container_name: exchange-market-data
    restart: unless-stopped
    environment:
      <<: [*common-env, *redis-env, *rabbitmq-env, *timescale-env, *kafka-env]
      HTTP_PORT: 3005
      GRPC_PORT: 5005
      WEBSOCKET_PORT: 6005
      KAFKA_CONSUMER_GROUP: market-data-service
      MATCHING_ENGINE_GRPC: matching-engine:5010
      TRADING_GRPC: trading-service:5004
      # Instance
      INSTANCE_ID: market-data-1
      # Data Providers
      COINGECKO_API_URL: https://api.coingecko.com/api/v3
      COINGECKO_API_KEY:
      BINANCE_API_URL: https://api.binance.com
      BINANCE_WS_URL: wss://stream.binance.com:9443/ws
      # Cache TTL (seconds)
      CACHE_TTL_TICKER: 5
      CACHE_TTL_ORDERBOOK: 1
      CACHE_TTL_KLINE: 60
      CACHE_TTL_MARKET_CAP: 300
      # Workers
      TICKER_WORKERS: 5
      KLINE_WORKERS: 3
      ORDERBOOK_WORKERS: 5
      # Sync Intervals (seconds)
      TICKER_SYNC_INTERVAL: 5
      KLINE_SYNC_INTERVAL: 60
      MARKET_CAP_SYNC_INTERVAL: 300
      # Feature Flags
      ENABLE_BINANCE: true
      ENABLE_COINGECKO: true
      ENABLE_NFT_DATA: false
      ENABLE_RWA_DATA: false
    ports:
      - '3005:3005'
      - '5005:5005'
      - '6005:6005'
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - exchange-network

  matching-engine:
    build:
      context: ./services/matching-engine
      dockerfile: Dockerfile
    container_name: exchange-matching-engine
    restart: unless-stopped
    environment:
      <<: [*common-env, *redis-env, *rabbitmq-env, *postgres-env, *kafka-env]
      PORT: 3010
      GRPC_PORT: 5010
      WEBSOCKET_PORT: 6010
      # Instance Configuration (NEW)
      INSTANCE_ID: matching-engine-1
      # Performance Tuning
      MAX_WORKERS: 10
      ORDER_QUEUE_SIZE: 100000
      CANCEL_QUEUE_SIZE: 10000
      CONSUMER_GROUP: matching-engine
    ports:
      - '3010:3010'
      - '5010:5010'
      - '6010:6010'
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - exchange-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: exchange-notification
    restart: unless-stopped
    environment:
      <<: [*common-env, *postgres-env, *redis-env, *rabbitmq-env, *kafka-env]
      PORT: 3006
      # Email Configuration - SendGrid
      SENDGRID_API_KEY: your-sendgrid-api-key
      SENDGRID_FROM_EMAI: noreply@yourcompany.com
      SENDGRID_FROM_NAME: Your Company
      # Email Configuration - AWS SES
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: your-aws-access-key
      AWS_SECRET_ACCESS_KEY: your-aws-secret-key
      AWS_SES_FROM_EMAIL: noreply@yourcompany.com
      # SMS Configuration - Twilio
      TWILIO_ACCOUNT_SID: your-twilio-account-sid
      TWILIO_AUTH_TOKEN: your-twilio-auth-token
      TWILIO_PHONE_NUMBER: +1234567890
      # SMS Configuration - Kavenegar (Iran)
      KAVENEGAR_API_KEY: your-kavenegar-api-key
      KAVENEGAR_SENDER: your-kavenegar-sender
      # Firebase Cloud Messaging (Push Notifications)
      FCM_PROJECT_ID: your-firebase-project-id
      FCM_PRIVATE_KEY: your-firebase-private-key
      FCM_CLIENT_EMAIL: your-firebase-client-email
      # Apple Push Notification Service
      APNS_KEY_ID: your-apns-key-id
      APNS_TEAM_ID: your-apns-team-id
      APNS_BUNDLE_ID: com.yourcompany.app
      APNS_PRIVATE_KEY_PATH: /path/to/AuthKey.p8
      APNS_PRODUCTION: false
      # Telegram Bot
      TELEGRAM_BOT_TOKEN: your-telegram-bot-token
      # WhatsApp Business API
      WHATSAPP_API_URL: https://api.whatsapp.com
      WHATSAPP_API_TOKEN: your-whatsapp-api-token
      WHATSAPP_PHONE_NUMBER_ID: your-phone-number-id
      # Notification Settings
      MAX_RETRY_ATTEMPTS: 3
      RETRY_DELAY_MS: 5000
      BATCH_SIZE: 100
    ports:
      - '3006:3006'
    depends_on: *common-depends
    networks:
      - exchange-network

  compliance-service:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: exchange-compliance
    restart: unless-stopped
    environment:
      <<: [*common-env, *postgres-env, *minio-env, *rabbitmq-env, *service-urls]
      PORT: 3007
    ports:
      - '3007:3007'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - exchange-network

  security-service:
    build:
      context: .
      dockerfile: services/security-service/Dockerfile
    container_name: exchange-security
    restart: unless-stopped
    environment:
      <<: [*common-env, *postgres-env, *redis-env, *rabbitmq-env]
      PORT: 3008
      # Security email 
      CRITICAL_ALERT_EMAILS: security@exchange.com,admin@exchange.com
      # Security service features
      ENABLE_ANTI_PHISHING: true
      ENABLE_DEVICE_FINGERPRINTING: true
      ENABLE_TRANSACTION_MONITORING: true
      ENABLE_BUG_BOUNTY: true
      ENABLE_PROOF_OF_RESERVES: true
    ports:
      - '3008:3008'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - exchange-network

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    container_name: exchange-admin-service
    restart: unless-stopped
    environment:
      <<: [*common-env, *postgres-env, *service-urls]
      PORT: 3011
    ports:
      - '3011:3011'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - exchange-network

  # ==================== API Gateway ====================
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: exchange-api-gateway
    restart: unless-stopped
    environment:
      <<: [*common-env, *redis-env, *rabbitmq-env, *service-urls]
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - user-service
      - auth-service
      - wallet-service
      - trading-service
      - market-data-service
      - notification-service
      # - compliance-service
      # - security-service
      # - proof-of-reserves-service
      # - admin-service
    networks:
      - exchange-network

  # ==================== Frontend Services ====================
  marketing:
    build:
      context: .
      dockerfile: frontend/apps/marketing/Dockerfile
    expose:
      - '3100'
    networks:
      - exchange-network

  exchange-app:
    build:
      context: .
      dockerfile: frontend/apps/exchange-app/Dockerfile
    volumes:
      - exchange_app_dist:/dist
    networks:
      - exchange-network

  # ==================== Nginx Proxy ====================
  nginx:
    image: nginx:alpine
    container_name: exchange-nginx
    restart: unless-stopped
    volumes:
      - exchange_app_dist:/usr/share/nginx/html/app:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'
    depends_on:
      - marketing
      - exchange-app
      - api-gateway
    networks:
      - exchange-network

networks:
  exchange-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  timescaledb_data:
  rabbitmq_data:
  minio_data:
  kafka_data:
  exchange_app_dist: