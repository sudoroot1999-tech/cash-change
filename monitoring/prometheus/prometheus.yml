global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'crypto-exchange'
    environment: 'production'

# Load alert rules
rule_files:
  - 'alerts/security-alerts.yml'
  - 'alerts/service-alerts.yml'
  - '/etc/prometheus/alerts/*.yml'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Security Services
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3002']
    metrics_path: 'health/metrics'
    scrape_interval: 10s

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3001']
    metrics_path: 'health/metrics'
    scrape_interval: 10s

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3006']
    metrics_path: 'health/metrics'
    scrape_interval: 10s

  - job_name: 'security-service'
    static_configs:
      - targets: ['security-service:3008']
    metrics_path: 'health/metrics'
    scrape_interval: 10s

  # Trading Services
  - job_name: 'matching-engine'
    static_configs:
      - targets: ['matching-engine:8080']
    
  - job_name: 'trading-api'
    static_configs:
      - targets: ['trading-api:3004']
    
  # Infrastructure
    # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

    # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'timescaledb'
    static_configs:
      - targets: ['timescaledb:5432']
    
  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'redis-security'
    static_configs:
      - targets: ['redis-security:6379']
    
    # RabbitMQ
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

    # MinIO
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ['minio:9000']

  # Elasticsearch
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
