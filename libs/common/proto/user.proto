syntax = "proto3";

package user;

service UserService {
  rpc FindById (FindByIdRequest) returns (UserResponse);
  rpc FindByEmail (FindByEmailRequest) returns (UserResponse);
  rpc UpdateKycLevel (UpdateKycLevelRequest) returns (UserResponse);
}

message FindByIdRequest {
  string id = 1;
}

message FindByEmailRequest {
  string email = 1;
}

message UpdateKycLevelRequest {
  string user_id = 1;
  int32 kyc_level = 2;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string status = 3;
  string tier = 4;
  int32 kyc_level = 5;
  bool two_factor_enabled = 6;
  optional string password_hash = 7;
}
