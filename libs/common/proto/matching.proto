syntax = "proto3";

package matching;

option go_package = "github.com/exchange/matching-engine/internal/pb";

service MatchingService {
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

message SubmitOrderRequest {
  string id = 1;
  string user_id = 2;
  string symbol = 3;
  string side = 4;
  string type = 5;
  string price = 6;
  string quantity = 7;
  string stop_price = 8;
  string time_in_force = 9;
  string client_order_id = 10;
}

message SubmitOrderResponse {
  Order order = 1;
  repeated Trade trades = 2;
}

message CancelOrderRequest {
  string id = 1;
  string symbol = 2;
}

message CancelOrderResponse {
  Order order = 1;
}

message Order {
  string id = 1;
  string user_id = 2;
  string symbol = 3;
  string side = 4;
  string type = 5;
  string status = 6;
  string price = 7;
  string quantity = 8;
  string filled_quantity = 9;
  string remaining_quantity = 10;
  string stop_price = 11;
  string time_in_force = 12;
  string client_order_id = 13;
  string created_at = 14;
  string updated_at = 15;
}

message Trade {
  string id = 1;
  string symbol = 2;
  string buyer_order_id = 3;
  string seller_order_id = 4;
  string buyer_id = 5;
  string seller_id = 6;
  string price = 7;
  string quantity = 8;
  bool is_buyer_maker = 9;
  string created_at = 10;
}
