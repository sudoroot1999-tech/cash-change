syntax = "proto3";

package matching;

option go_package = "github.com/exchange/matching-engine/internal/pb";

// MatchingService provides operational endpoints for the matching engine.
// Note: Order submission and cancellation should go through message queues,
// not direct gRPC calls. This service is for monitoring and observability only.
service MatchingService {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc GetOrderBook(GetOrderBookRequest) returns (GetOrderBookResponse);
}

// Health check
message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string service = 2;
  string version = 3;
  int64 timestamp = 4;
}

// Metrics
message GetMetricsRequest {}

message GetMetricsResponse {
  int64 total_orders = 1;
  int64 total_matches = 2;
  int32 active_order_books = 3;
  string uptime = 4;
  double match_rate_per_second = 5;
  int64 orders_per_second = 6;
  double average_latency_ms = 7;
}

// Order Book
message GetOrderBookRequest {
  string symbol = 1;
  int32 depth = 2;
}

message GetOrderBookResponse {
  string symbol = 1;
  repeated PriceLevel bids = 2;
  repeated PriceLevel asks = 3;
  int64 last_update_id = 4;
  int64 timestamp = 5;
}

message PriceLevel {
  string price = 1;
  string quantity = 2;
}
