syntax = "proto3";

package security;

service SecurityService {
  rpc ValidateApiKey (ValidateApiKeyRequest) returns (ValidateApiKeyResponse);
  rpc CheckRiskScore (CheckRiskScoreRequest) returns (CheckRiskScoreResponse);
}

message ValidateApiKeyRequest {
  string api_key = 1;
  string api_secret = 2;
}

message ValidateApiKeyResponse {
  bool is_valid = 1;
  string user_id = 2;
  repeated string permissions = 3;
}

message CheckRiskScoreRequest {
  string user_id = 1;
  string action = 2; // e.g., "withdraw", "login"
  string ip_address = 3;
}

message CheckRiskScoreResponse {
  double score = 1; // 0.0 to 100.0
  string risk_level = 2; // "low", "medium", "high", "critical"
  bool check_passed = 3;
}
