apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-old-pods
  namespace: production
  labels:
    app: cleanup
spec:
  # Run daily at 2 AM UTC
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cleanup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: cleanup-service-account
          containers:
          - name: kubectl
            image: bitnami/kubectl:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "Cleaning up completed pods..."
              kubectl delete pods --field-selector status.phase=Succeeded -n production
              kubectl delete pods --field-selector status.phase=Failed -n production
              
              echo "Cleaning up evicted pods..."
              kubectl get pods -n production | grep Evicted | awk '{print $1}' | xargs -r kubectl delete pod -n production
              
              echo "Cleanup completed!"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-service-account
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-role
  namespace: production
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-rolebinding
  namespace: production
subjects:
- kind: ServiceAccount
  name: cleanup-service-account
  namespace: production
roleRef:
  kind: Role
  name: cleanup-role
  apiGroup: rbac.authorization.k8s.io
