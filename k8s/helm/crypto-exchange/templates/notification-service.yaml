# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-api-config
  labels:
    app: notification-api
    name: notification-service
data:
  NODE_ENV: "production"
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  KAFKA_LISTENERS: "PLAINTEXT://kafka:9092"
  PORT: 3006
  # Email Configuration - SendGrid
  SENDGRID_API_KEY: your-sendgrid-api-key
  SENDGRID_FROM_EMAI: noreply@yourcompany.com
  SENDGRID_FROM_NAME: Your Company
  # Email Configuration - AWS SES
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: your-aws-access-key
  AWS_SECRET_ACCESS_KEY: your-aws-secret-key
  AWS_SES_FROM_EMAIL: noreply@yourcompany.com
  # SMS Configuration - Twilio
  TWILIO_ACCOUNT_SID: your-twilio-account-sid
  TWILIO_AUTH_TOKEN: your-twilio-auth-token
  TWILIO_PHONE_NUMBER: 1234567890
  # SMS Configuration - Kavenegar (Iran)
  KAVENEGAR_API_KEY: your-kavenegar-api-key
  KAVENEGAR_SENDER: your-kavenegar-sender
  # Firebase Cloud Messaging (Push Notifications)
  FCM_PROJECT_ID: your-firebase-project-id
  FCM_PRIVATE_KEY: your-firebase-private-key
  FCM_CLIENT_EMAIL: your-firebase-client-email
  # Apple Push Notification Service
  APNS_KEY_ID: your-apns-key-id
  APNS_TEAM_ID: your-apns-team-id
  APNS_BUNDLE_ID: com.yourcompany.app
  APNS_PRIVATE_KEY_PATH: /path/to/AuthKey.p8
  APNS_PRODUCTION: false
  # Telegram Bot
  TELEGRAM_BOT_TOKEN: your-telegram-bot-token
  # WhatsApp Business API
  WHATSAPP_API_URL: https://api.whatsapp.com
  WHATSAPP_API_TOKEN: your-whatsapp-api-token
  WHATSAPP_PHONE_NUMBER_ID: your-phone-number-id
  # Notification Settings
  MAX_RETRY_ATTEMPTS: 3
  RETRY_DELAY_MS: 5000
  BATCH_SIZE: 100
---

# Secrets
apiVersion: v1
kind: Secret
metadata:
  name:  notification-api-secret
  labels:
    app: notification-api
    name: notification-service
type: Opaque
stringData:
  database-url: "postgresql://exchange-user:exchange-password@postgresql:5432/exchange"
  redis-url: "redis://:exchange-password@redis-master:6379"
  rabbitmq-url: "amqp://exchange-user:exchange-password@rabbitmq:5672"
  mongodb-url: "mongodb://root:exchange-password@mongodb:27017"
  jwt-secret: "dev-jwt-secret-change-in-production"
---

# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-api-hpa
  labels:
    app: notification-api
    name: notification-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-api
  minReplicas: 1
  maxReplicas: 1
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max
---

# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-api-pdb
  labels:
    app: notification-api
    name: notification-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: notification-api
---

# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-api-netpol
  labels:
    app: notification-api
    name: notification-service
spec:
  podSelector:
    matchLabels:
     app: notification-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: nginx-ingress
    ports:
    - protocol: TCP
      port: 3010
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql
    ports:
    - protocol: TCP
      port: 5432
  # Allow Redis
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow RabbitMQ
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: rabbitmq
    ports:
    - protocol: TCP
      port: 5672
  # Allow MongoDB
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: mongodb
    ports:
    - protocol: TCP
      port: 27017
  # Allow Elasticsearch
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: elasticsearch
    ports:
    - protocol: TCP
      port: 9200
  # Allow Kafka
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kafka
    ports:
    - protocol: TCP
      port: 9092
  # Allow Jaeger
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: jaeger
    ports:
    - protocol: TCP
      port: 4318
  # Allow external HTTPS
  # - to:
  #   - namespaceSelector: {}
  #   ports:
  #   - protocol: TCP
  #     port: 443
  # Allow inter-service communication
  - to:
    - podSelector: 
        matchLabels:
          app : notification-api
    ports:
    - protocol: TCP
      port: 3010
    - protocol: TCP
      port: 5010
---

# Service
apiVersion: v1
kind: Service
metadata:
  name: notification-api
  labels:
    app: notification-api
    name: notification-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3010"
spec:
  type: ClusterIP
  ports:
  - port: 3010
    targetPort: 3010
    protocol: TCP
    name: http
  - port: 5010
    targetPort: 5010
    protocol: TCP
    name: grpc
  selector:
    app: notification-api
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---

# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
  labels:
    app: notification-api
    name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-api
        name: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3010"
        prometheus.io/path: "/metrics"
    spec:
      # serviceAccountName:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      containers:
      - name: notification-api
        image: {{ include "crypto-exchange.image" (dict "Values" $.Values "image" $service.image) }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3010
          protocol: TCP
        - name: grpc
          containerPort: 5010
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: notification-api-secret
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: notification-api-secret
              key: redis-url
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: notification-api-secret
              key: rabbitmq-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: notification-api-secret
              key: jwt-secret
        envFrom:
        - configMapRef:
            name: notification-api-config
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # resources:
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /var/log
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      # imagePullSecrets:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - notification-api
              topologyKey: kubernetes.io/hostname
