# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-api-config
  labels:
    app: user-api
    name: user-service
data:
  NODE_ENV: "production"
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  KAFKA_LISTENERS: "PLAINTEXT://kafka:9092"
  PORT: 3001
  GRPC_PORT: 5001
  # Commission Rates (in percentage)
  TIER1_COMMISSION_RATE: 20
  TIER2_COMMISSION_RATE: 10
  VIP_COMMISSION_RATE: 30
  # Bonus Settings
  SIGNUP_BONUS: 10
  FIRST_TRADE_BONUS: 20
  MINIMUM_TRADE_VOLUME_FOR_BONUS: 100
  # Payout Settings
  MINIMUM_PAYOUT_AMOUNT: 50
  PAYOUT_SCHEDULE: weekly
  PAYOUT_DAY: monday
  AUTO_PAYOUT_ENABLED: true
  # Referral Code Settings
  REFERRAL_CODE_LENGTH: 8
  REFERRAL_CODE_PREFIX: REF
  # Fraud Detection Settings
  MAX_SIGNUPS_PER_IP: 3
  MAX_SIGNUPS_PER_DEVICE: 5
  SUSPICIOUS_PATTERN_THRESHOLD: 0.7
  ENABLE_FRAUD_DETECTION: true
  # Service Integration
  SECURITY_SERVICE_GRPC_URL: security-api.default:5008
  # TRADING_SERVICE_URL: http://localhost:3003
  # NOTIFICATION_SERVICE_URL: http://localhost:3006
  # Analytics
  ENABLE_ANALYTICS: true
  ANALYTICS_RETENTION_DAYS: 365
  # Affiliate Program
  AFFILIATE_MIN_FOLLOWERS: 1000
  AFFILIATE_CUSTOM_COMMISSION_ENABLED: true
  AFFILIATE_APPROVAL_REQUIRED: true
---

# Secrets
apiVersion: v1
kind: Secret
metadata:
  name:  user-api-secret
  labels:
    app: user-api
    name: user-service
type: Opaque
stringData:
  database-url: "postgresql://exchange-user:exchange-password@postgresql:5432/exchange"
  redis-url: "redis://:exchange-password@redis-master:6379"
  rabbitmq-url: "amqp://exchange-user:exchange-password@rabbitmq:5672"
  mongodb-url: "mongodb://root:exchange-password@mongodb:27017"
  jwt-secret: "dev-jwt-secret-change-in-production"
---

# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-api-hpa
  labels:
    app: user-api
    name: user-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-api
  minReplicas: 1
  maxReplicas: 1
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max
---

# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-api-pdb
  labels:
    app: user-api
    name: user-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: user-api
---

# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-api-netpol
  labels:
    app: user-api
    name: user-service
spec:
  podSelector:
    matchLabels:
     app: user-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: nginx-ingress
    ports:
    - protocol: TCP
      port: 3001
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql
    ports:
    - protocol: TCP
      port: 5432
  # Allow Redis
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow RabbitMQ
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: rabbitmq
    ports:
    - protocol: TCP
      port: 5672
  # Allow MongoDB
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: mongodb
    ports:
    - protocol: TCP
      port: 27017
  # Allow Elasticsearch
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: elasticsearch
    ports:
    - protocol: TCP
      port: 9200
  # Allow Kafka
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kafka
    ports:
    - protocol: TCP
      port: 9092
  # Allow Jaeger
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: jaeger
    ports:
    - protocol: TCP
      port: 4318
  # Allow external HTTPS
  # - to:
  #   - namespaceSelector: {}
  #   ports:
  #   - protocol: TCP
  #     port: 443
  # Allow inter-service communication
  - to:
    - podSelector: 
        matchLabels:
          app : user-api
    ports:
    - protocol: TCP
      port: 3001
    - protocol: TCP
      port: 5001
---

# Service
apiVersion: v1
kind: Service
metadata:
  name: user-api
  labels:
    app: user-api
    name: user-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3001"
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  - port: 5001
    targetPort: 5001
    protocol: TCP
    name: grpc
  selector:
    app: user-api
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---

# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
  labels:
    app: user-api
    name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: user-api
        name: user-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      # serviceAccountName:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      containers:
      - name: user-api
        image: {{ include "crypto-exchange.image" (dict "Values" $.Values "image" $service.image) }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3001
          protocol: TCP
        - name: grpc
          containerPort: 5001
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: user-api-secret
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: user-api-secret
              key: redis-url
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: user-api-secret
              key: rabbitmq-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: user-api-secret
              key: jwt-secret
        envFrom:
        - configMapRef:
            name: user-api-config
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # resources:
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /var/log
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      # imagePullSecrets:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - user-api
              topologyKey: kubernetes.io/hostname
