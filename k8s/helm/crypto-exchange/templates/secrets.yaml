{{- range $serviceName, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $service.name }}-secret
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $service.name }}
    {{- include "crypto-exchange.labels" $ | nindent 4 }}
type: Opaque
stringData:
  database-url: "postgresql://{{ $.Values.postgresql.auth.username }}:{{ $.Values.postgresql.auth.password }}@{{ $.Release.Name }}-postgresql:5432/{{ $service.name }}_db"
  jwt-secret: "CHANGE_ME_IN_PRODUCTION"
  api-key: "CHANGE_ME_IN_PRODUCTION"
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "crypto-exchange.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-url: "redis://:{{ .Values.redis.auth.password }}@{{ .Release.Name }}-redis-master:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "crypto-exchange.labels" . | nindent 4 }}
type: Opaque
stringData:
  rabbitmq-url: "amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@{{ .Release.Name }}-rabbitmq:5672"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "crypto-exchange.labels" . | nindent 4 }}
type: Opaque
stringData:
  mongodb-url: "mongodb://root:{{ .Values.mongodb.auth.rootPassword }}@{{ .Release.Name }}-mongodb:27017"
