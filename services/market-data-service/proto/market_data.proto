syntax = "proto3";

package marketdata;

option go_package = "github.com/trading-platform/market-data-service/proto";

// MarketDataService provides market data via gRPC
service MarketDataService {
  // GetTicker returns ticker for a trading pair
  rpc GetTicker(GetTickerRequest) returns (TickerResponse);
  
  // GetTickers returns tickers for multiple pairs
  rpc GetTickers(GetTickersRequest) returns (TickersResponse);
  
  // GetOrderbook returns orderbook for a trading pair
  rpc GetOrderbook(GetOrderbookRequest) returns (OrderbookResponse);
  
  // GetKlines returns kline/candlestick data
  rpc GetKlines(GetKlinesRequest) returns (KlinesResponse);
  
  // GetRecentTrades returns recent trades
  rpc GetRecentTrades(GetRecentTradesRequest) returns (TradesResponse);
  
  // GetMarketInfo returns market information
  rpc GetMarketInfo(GetMarketInfoRequest) returns (MarketInfoResponse);
  
  // StreamTicker streams real-time ticker updates
  rpc StreamTicker(StreamTickerRequest) returns (stream TickerResponse);
  
  // StreamOrderbook streams real-time orderbook updates
  rpc StreamOrderbook(StreamOrderbookRequest) returns (stream OrderbookResponse);
  
  // HealthCheck returns service health status
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// Request messages
message GetTickerRequest {
  string trading_pair = 1;
}

message GetTickersRequest {
  repeated string trading_pairs = 1;
}

message GetOrderbookRequest {
  string trading_pair = 1;
  int32 limit = 2;
}

message GetKlinesRequest {
  string trading_pair = 1;
  string interval = 2;
  int32 limit = 3;
}

message GetRecentTradesRequest {
  string trading_pair = 1;
  int32 limit = 2;
}

message GetMarketInfoRequest {
  string symbol = 1;
}

message StreamTickerRequest {
  repeated string trading_pairs = 1;
}

message StreamOrderbookRequest {
  string trading_pair = 1;
}

message HealthCheckRequest {}

// Response messages
message TickerResponse {
  string symbol = 1;
  string trading_pair = 2;
  string price = 3;
  string price_change = 4;
  string price_change_pct = 5;
  string high_24h = 6;
  string low_24h = 7;
  string volume_24h = 8;
  string quote_volume = 9;
  string bid_price = 10;
  string ask_price = 11;
  string source = 12;
  int64 timestamp = 13;
}

message TickersResponse {
  repeated TickerResponse tickers = 1;
}

message PriceLevel {
  string price = 1;
  string quantity = 2;
}

message OrderbookResponse {
  string trading_pair = 1;
  repeated PriceLevel bids = 2;
  repeated PriceLevel asks = 3;
  int64 last_update_id = 4;
  string source = 5;
  int64 timestamp = 6;
}

message Kline {
  string trading_pair = 1;
  string interval = 2;
  int64 open_time = 3;
  int64 close_time = 4;
  string open = 5;
  string high = 6;
  string low = 7;
  string close = 8;
  string volume = 9;
  string quote_volume = 10;
  int64 trade_count = 11;
  string source = 12;
}

message KlinesResponse {
  repeated Kline klines = 1;
}

message Trade {
  string id = 1;
  string trading_pair = 2;
  string price = 3;
  string quantity = 4;
  string side = 5;
  int64 timestamp = 6;
  string source = 7;
}

message TradesResponse {
  repeated Trade trades = 1;
}

message MarketInfoResponse {
  string symbol = 1;
  string name = 2;
  string asset_type = 3;
  string market_cap = 4;
  int32 market_cap_rank = 5;
  string circulating_supply = 6;
  string total_supply = 7;
  string max_supply = 8;
  string ath = 9;
  int64 ath_date = 10;
  string atl = 11;
  int64 atl_date = 12;
  int64 last_updated = 13;
}

message HealthCheckResponse {
  bool healthy = 1;
  map<string, string> details = 2;
}
