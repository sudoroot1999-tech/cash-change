syntax = "proto3";

package trading;

option go_package = "github.com/trading-platform/trading-service/proto";

import "google/protobuf/timestamp.proto";

// Trading Service
service TradingService {
  // Orders
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc GetOpenOrders(GetOpenOrdersRequest) returns (OrderList);
  
  // Positions
  rpc GetPosition(GetPositionRequest) returns (Position);
  rpc GetUserPositions(GetUserPositionsRequest) returns (PositionList);
  rpc UpdateLeverage(UpdateLeverageRequest) returns (Position);
  
  // Market Data
  rpc GetTicker(GetTickerRequest) returns (Ticker);
  rpc GetOrderBook(GetOrderBookRequest) returns (OrderBook);
  rpc GetTrades(GetTradesRequest) returns (TradeList);
  
  // Streaming
  rpc StreamTicker(StreamTickerRequest) returns (stream Ticker);
  rpc StreamOrderBook(StreamOrderBookRequest) returns (stream OrderBook);
  rpc StreamTrades(StreamTradesRequest) returns (stream Trade);
  rpc StreamUserEvents(StreamUserEventsRequest) returns (stream UserEvent);
}

// Enums
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
  ORDER_TYPE_STOP_LOSS = 3;
  ORDER_TYPE_STOP_LIMIT = 4;
  ORDER_TYPE_TAKE_PROFIT = 5;
  ORDER_TYPE_TRAILING_STOP = 6;
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_OPEN = 2;
  ORDER_STATUS_PARTIALLY_FILLED = 3;
  ORDER_STATUS_FILLED = 4;
  ORDER_STATUS_CANCELLED = 5;
  ORDER_STATUS_REJECTED = 6;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

enum TradingType {
  TRADING_TYPE_UNSPECIFIED = 0;
  TRADING_TYPE_SPOT = 1;
  TRADING_TYPE_MARGIN = 2;
  TRADING_TYPE_FUTURES = 3;
}

enum MarginMode {
  MARGIN_MODE_UNSPECIFIED = 0;
  MARGIN_MODE_CROSS = 1;
  MARGIN_MODE_ISOLATED = 2;
}

// Messages
message Order {
  string id = 1;
  string user_id = 2;
  string trading_pair = 3;
  OrderType type = 4;
  OrderSide side = 5;
  string price = 6;
  string quantity = 7;
  string filled_quantity = 8;
  string remaining_quantity = 9;
  OrderStatus status = 10;
  TimeInForce time_in_force = 11;
  TradingType trading_type = 12;
  MarginMode margin_mode = 13;
  string leverage = 14;
  string stop_price = 15;
  string maker_fee = 16;
  string taker_fee = 17;
  bool reduce_only = 18;
  bool post_only = 19;
  string client_order_id = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
}

message Trade {
  string id = 1;
  string buy_order_id = 2;
  string sell_order_id = 3;
  string buy_user_id = 4;
  string sell_user_id = 5;
  string trading_pair = 6;
  string price = 7;
  string quantity = 8;
  string buyer_fee = 9;
  string seller_fee = 10;
  TradingType trading_type = 11;
  google.protobuf.Timestamp timestamp = 12;
}

message Position {
  string id = 1;
  string user_id = 2;
  string trading_pair = 3;
  OrderSide side = 4;
  string size = 5;
  string entry_price = 6;
  string mark_price = 7;
  string liquidation_price = 8;
  string leverage = 9;
  MarginMode margin_mode = 10;
  string margin = 11;
  string unrealized_pnl = 12;
  string realized_pnl = 13;
  TradingType trading_type = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message Ticker {
  string trading_pair = 1;
  string last_price = 2;
  string bid_price = 3;
  string ask_price = 4;
  string high_24h = 5;
  string low_24h = 6;
  string volume_24h = 7;
  string volume_quote_24h = 8;
  string price_change_24h = 9;
  string price_change_percent_24h = 10;
  google.protobuf.Timestamp timestamp = 11;
}

message OrderBook {
  string trading_pair = 1;
  repeated OrderBookLevel bids = 2;
  repeated OrderBookLevel asks = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message OrderBookLevel {
  string price = 1;
  string quantity = 2;
}

message UserEvent {
  string type = 1;
  string user_id = 2;
  oneof payload {
    Order order = 3;
    Trade trade = 4;
    Position position = 5;
  }
  google.protobuf.Timestamp timestamp = 6;
}

// Requests
message CreateOrderRequest {
  string user_id = 1;
  string trading_pair = 2;
  OrderType type = 3;
  OrderSide side = 4;
  string price = 5;
  string quantity = 6;
  string stop_price = 7;
  TimeInForce time_in_force = 8;
  TradingType trading_type = 9;
  MarginMode margin_mode = 10;
  string leverage = 11;
  bool reduce_only = 12;
  bool post_only = 13;
  string client_order_id = 14;
}

message CancelOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

message CancelOrderResponse {
  bool success = 1;
  string message = 2;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOpenOrdersRequest {
  string user_id = 1;
  string trading_pair = 2;
}

message OrderList {
  repeated Order orders = 1;
}

message GetPositionRequest {
  string user_id = 1;
  string trading_pair = 2;
}

message GetUserPositionsRequest {
  string user_id = 1;
}

message PositionList {
  repeated Position positions = 1;
}

message UpdateLeverageRequest {
  string user_id = 1;
  string trading_pair = 2;
  string leverage = 3;
}

message GetTickerRequest {
  string trading_pair = 1;
}

message GetOrderBookRequest {
  string trading_pair = 1;
  int32 depth = 2;
}

message GetTradesRequest {
  string trading_pair = 1;
  int32 limit = 2;
}

message TradeList {
  repeated Trade trades = 1;
}

message StreamTickerRequest {
  string trading_pair = 1;
}

message StreamOrderBookRequest {
  string trading_pair = 1;
  int32 depth = 2;
}

message StreamTradesRequest {
  string trading_pair = 1;
}

message StreamUserEventsRequest {
  string user_id = 1;
}
